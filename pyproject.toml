[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "UnOffical_TAGO_API"
dynamic = ["version"]
description = "Unofficial Python wrapper for TAGO Bus API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hyuntroll", email = "hsm200905292@gmail.com" },
]
dependencies = [
    "httpx",
    "xmltodict",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/hyuntroll/TAGOBus-API"
Issues = "https://github.com/hyuntroll/TAGOBus-API/issues"

[project.optional-dependencies]
dev = [
    "build",
    "flake8",
    "mypy",
    "pytest",
    "twine",
]

[tool.setuptools.dynamic]
version = { attr = "tagoapi._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tagoapi = [
    "py.typed",
    "data/*.csv.gz",
]
